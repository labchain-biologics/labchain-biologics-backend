name: SDK release

# Publishes labchain-biologics-sdk to PyPI when a tag `sdk-vX.Y.Z` is pushed.
# Trusted publishing (OIDC): no PyPI token is stored in GitHub. PyPI must list this
# repository, this workflow file and the `pypi` environment as a trusted publisher.
#
# Pull requests that touch the SDK or this workflow run the build job as a dry run (tests,
# build, twine, clean-install smoke test) so packaging problems show up before a release.
# The tag checks and the publish job only run for tags.

on:
  push:
    tags: ["sdk-v*"]
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "uv.lock"
      - ".github/workflows/sdk-release.yml"

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"

      - name: Read the SDK version
        id: version
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' sdk/src/labchain/_version.py)"
          echo "SDK version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the SDK version
        if: github.event_name == 'push'
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          echo "tag=${tag} version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match sdk/src/labchain/_version.py (${version})"
            exit 1
          fi
          heading="$(grep -E "^## ${version//./\.}( |$)" sdk/CHANGELOG.md || true)"
          if [ -z "${heading}" ]; then
            echo "::error::sdk/CHANGELOG.md has no '## ${version}' section"
            exit 1
          fi
          if echo "${heading}" | grep -qi "unreleased"; then
            echo "::error::sdk/CHANGELOG.md still marks ${version} as unreleased"
            exit 1
          fi

      - name: Test and type-check the SDK
        run: |
          uv run --locked --package labchain-biologics-sdk pytest sdk
          uv run --locked --package labchain-biologics-sdk mypy --config-file sdk/pyproject.toml sdk/src sdk/tests

      - name: Build sdist and wheel
        run: uv build --package labchain-biologics-sdk --out-dir dist

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv --python 3.11 /tmp/smoke
          uv pip install --python /tmp/smoke "$(ls dist/*.whl)[cli]"
          /tmp/smoke/bin/python -c "import labchain; print(labchain.__version__); assert labchain.__version__ == '${VERSION}'"
          /tmp/smoke/bin/labchain version
          # The licence of the SDK must ship with it.
          unzip -l dist/*.whl | grep -q "licenses/LICENSE"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Never from a pull request: only a pushed sdk-v* tag publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/labchain-biologics-sdk/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
