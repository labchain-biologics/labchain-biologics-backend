name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.filter.outputs.any }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      markdown: ${{ steps.filter.outputs.markdown }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needed so paths-filter can diff on push events (vs previous commit).
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            any:
              - '**'
            python:
              - 'app/**'
              - 'tests/**'
              - 'sdk/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
            workflows:
              - '.github/workflows/**'
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.yaml'
              - 'mkdocs.yml'
              - 'docs/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - 'scripts/**'

      - name: Fail when no files changed
        if: steps.filter.outputs.any != 'true'
        run: |
          echo "::error::No file changes detected for this event (empty PR or empty push)."
          exit 1

      - name: Summarize changed areas
        run: |
          {
            echo "## Changed areas"
            echo ""
            echo "| Area | Changed |"
            echo "| --- | --- |"
            echo "| Python / tests | \`${{ steps.filter.outputs.python }}\` |"
            echo "| Workflows | \`${{ steps.filter.outputs.workflows }}\` |"
            echo "| Markdown | \`${{ steps.filter.outputs.markdown }}\` |"
            echo "| Docker / scripts | \`${{ steps.filter.outputs.docker }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labchain
          POSTGRES_PASSWORD: labchain
          POSTGRES_DB: labchain
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U labchain -d labchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-packages --extra dev

      - name: Run unit and integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://labchain:labchain@localhost:5433/labchain_test
        run: uv run poe test

      - name: Run Python SDK tests
        run: uv run poe sdk-test

  pre-commit:
    name: Pre-commit (lint / format / mypy)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-packages --extra dev

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: uv run poe check

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
          shellcheck: true

  markdownlint:
    name: Markdownlint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24

  trivy:
    name: Trivy (fs / secrets / misconfig)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  import-smoke:
    name: App import smoke check
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Import FastAPI application
        env:
          SECRET_KEY: ci-smoke-secret-key-at-least-32-characters-long
          DATABASE_URL: postgresql+asyncpg://labchain:labchain@localhost:5432/labchain
        run: uv run python -c "from app.main import app; assert app.title"

      - name: Check committed OpenAPI contract is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json is stale. Run 'uv run poe openapi' and commit the result."
            exit 1
          }

  ci-success:
    name: CI gate
    needs:
      - changes
      - unit-tests
      - pre-commit
      - actionlint
      - markdownlint
      - trivy
      - import-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          for result in ${RESULTS//,/ }; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::One or more CI jobs failed (result=$result)."
              exit 1
            fi
          done
          echo "All CI checks passed (or were skipped as not applicable)."
