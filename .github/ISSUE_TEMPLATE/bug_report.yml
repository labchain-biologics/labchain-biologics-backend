name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not use this form: report it privately (see SECURITY.md).
        Never paste real patient, sample or customer data, credentials, tokens or signed URLs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API server
        - Python SDK
        - CLI (labchain)
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "SDK 0.2.0, server commit 4fe4818"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests or code, with synthetic data only.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, deployment (local compose, other), AWS Batch enabled or not.
