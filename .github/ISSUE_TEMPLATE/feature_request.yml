name: Feature request
description: Propose an improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API server
        - Python SDK
        - CLI (labchain)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: regulatory
    attributes:
      label: Regulatory impact
      description: Does it touch audited data, electronic records or signatures (21 CFR Part 11)?
