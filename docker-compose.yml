services:
  postgres:
    image: postgres:16-alpine
    container_name: labchain-postgres
    environment:
      POSTGRES_USER: labchain
      POSTGRES_PASSWORD: labchain
      POSTGRES_DB: labchain
    ports:
      - "5432:5432"
    volumes:
      - labchain_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labchain -d labchain"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.0
    container_name: labchain-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - labchain_localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  labchain_pg_data:
  labchain_localstack_data:
