services:
  postgres:
    image: postgres:16-alpine
    container_name: titerlane-postgres
    environment:
      POSTGRES_USER: titerlane
      POSTGRES_PASSWORD: titerlane
      POSTGRES_DB: titerlane
    ports:
      - "5433:5432"
    volumes:
      - titerlane_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titerlane -d titerlane"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.0
    container_name: titerlane-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - titerlane_localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  titerlane_pg_data:
  titerlane_localstack_data:
