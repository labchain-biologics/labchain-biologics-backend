[project]
name = "labchain-biologics-sdk"
version = "0.1.0"
description = "Python SDK for the LabChain Biologics API (multi-omics LIMS and nf-core orchestration)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LabChain Biologics" }]
# The SDK is Apache-2.0 so it can be imported by any code; the server stays AGPL-3.0-only.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["lims", "bioinformatics", "nextflow", "nf-core", "genomics", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# The `labchain` command: pip install "labchain-biologics-sdk[cli]".
cli = [
    "typer>=0.16.1",
]

[project.scripts]
labchain = "labchain.cli:main"

[project.urls]
Documentation = "https://labchain-biologics.github.io/labchain-biologics-backend/"
Source = "https://github.com/labchain-biologics/labchain-biologics-backend/tree/main/sdk"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "typer>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labchain"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The SDK is synchronous; the backend's pytest-asyncio plugin (shared venv) is not needed.
addopts = "-p no:asyncio"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
