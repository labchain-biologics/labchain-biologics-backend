[project]
name = "titerlane-biologics"
version = "0.1.0"
description = "Titerlane Biologics — FastAPI LIMS & Nextflow orchestration backend"
requires-python = ">=3.11"
authors = [{ name = "Titerlane Biologics" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.1",
    "boto3>=1.35.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "greenlet>=3.1.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "poethepoet>=0.32.0",
    "pre-commit>=4.0.0",
    "boto3-stubs[batch,s3]>=1.43.67",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
titerlane-server = "uvicorn:main"
titerlane-admin = "app.cli:run"

[tool.uv.workspace]
# The Python SDK (Apache-2.0) is developed here so API and client change together.
members = ["sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uvicorn]
factory = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.poe.tasks]
test = { cmd = "uv run pytest", help = "Run the test suite" }
e2e = { cmd = "uv run --package titerlane-biologics-sdk python scripts/e2e_api_walkthrough.py", help = "End-to-end API walkthrough through the Python SDK (running API required)" }
check = { cmd = "uv run pre-commit run --all-files", help = "Run pre-commit hooks" }
migrate = { cmd = "uv run alembic upgrade head", help = "Apply database migrations" }
start-local-run = { cmd = "docker compose --env-file .env up -d", help = "Launch local run" }
stop-local-run = { cmd = "docker compose --env-file .env stop", help = "Stop local run" }
down-local-run = { cmd = "docker compose --env-file .env down", help = "Down local run (Remove also containers and image)" }
start-dev = { cmd = "uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000", help = "Start the API in reload mode" }
openapi = { cmd = "uv run python scripts/export_openapi.py", help = "Export the OpenAPI contract to openapi.json" }
docs-serve = { cmd = "mkdocs serve", help = "Serve MkDocs locally (requires: uv sync --extra docs)" }
docs-build = { cmd = "mkdocs build --strict", help = "Build MkDocs site (requires: uv sync --extra docs)" }
sdk-test = { cmd = "uv run --package titerlane-biologics-sdk pytest sdk", help = "Run the Python SDK tests" }
sdk-typecheck = { cmd = "uv run --package titerlane-biologics-sdk mypy --config-file sdk/pyproject.toml sdk/src sdk/tests", help = "Type-check the Python SDK" }
