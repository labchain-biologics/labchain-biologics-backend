site_name: LabChain Biologics Backend
site_description: FastAPI async backend for LabChain Biologics — multi-omics LIMS and Nextflow orchestration
site_url: https://labchain-biologics.github.io/labchain-biologics-backend/
repo_url: https://github.com/labchain-biologics/labchain-biologics-backend
repo_name: labchain-biologics/labchain-biologics-backend
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API:
      - Overview: api-overview.md
      - Health:
          - GET /health: api/health.md
      - Auth:
          - POST /auth/login: api/auth/login.md
          - GET /auth/me: api/auth/me.md
          - POST /auth/logout: api/auth/logout.md
          - POST /auth/register: api/auth/register.md
          - /auth/tokens: api/auth/tokens.md
      - Workspaces:
          - GET/POST /workspaces: api/workspaces/create.md
          - /members: api/workspaces/members.md
      - Samples:
          - GET /samples: api/samples/list.md
          - POST /samples: api/samples/create.md
          - POST /samples/import: api/samples/import.md
          - PATCH /samples/bulk: api/samples/bulk-patch.md
          - DELETE /samples/bulk: api/samples/bulk-delete.md
          - GET /samples/{id}: api/samples/get.md
          - PATCH /samples/{id}: api/samples/update.md
          - DELETE /samples/{id}: api/samples/delete.md
      - Sequencing runs:
          - /sequencing-runs: api/sequencing-runs/index.md
      - FASTQ:
          - GET /fastq: api/fastq/list.md
          - POST /fastq/register: api/fastq/register.md
          - POST /fastq/{id}/verify: api/fastq/verify.md
      - Pipelines:
          - GET /pipelines: api/pipelines/list.md
          - GET /pipelines/{id}: api/pipelines/get.md
      - Runs:
          - POST /runs: api/runs/launch.md
          - GET /runs: api/runs/list.md
          - GET /runs/{id}: api/runs/get.md
          - GET /runs/{id}/logs/stream: api/runs/logs-stream.md
          - Logs & Nextflow events: api/runs/events.md
      - Results:
          - GET /results: api/results/list.md
          - GET /results/runs/{id}: api/results/by-run.md
          - GET /results/{id}/download: api/results/download.md
  - Python SDK:
      - Overview: sdk/index.md
      - Authentication: sdk/authentication.md
      - User guide: sdk/guide.md
      - Async client: sdk/async.md
      - Reference: sdk/reference.md
      - Errors: sdk/errors.md
  - Configuration: configuration.md
  - Development: development.md
  - Architecture: architecture.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/labchain-biologics/labchain-biologics-backend
